services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alaga
      POSTGRES_PASSWORD: alaga
      POSTGRES_DB: alagaalerta
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dotnet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alaga -d alagaalerta"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      ConnectionStrings__AlagaAlerta: Host=db;Port=5432;Database=alagaalerta;Username=alaga;Password=alaga
      Database__Seed: "true"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-dotnet:
